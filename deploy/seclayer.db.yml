# Postgres for the containerised stack, with TLS.
#
# Production mode refuses the SQLite fallback by design (server/db.ts:
# assertNotSilentlyFallingBack), so the container path always pairs SecLayer with
# a real database.
#
# TLS is not optional here: server/pgSsl.ts returns `{rejectUnauthorized:false}`
# for every database host that is not localhost/127.0.0.1, so the app will always
# open an SSL connection to `db`. A plain Postgres answers "The server does not
# support SSL connections" and the container crash-loops.
#
# The cert is generated by deploy/bootstrap.ps1 (or openssl by hand) into
# deploy/pg-tls. It is copied inside the container at start so the key can be
# owned by postgres with 0600 — a bind-mounted key keeps the host's permissions,
# which Postgres refuses.
services:
  db:
    image: postgres:16
    container_name: stack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: seclayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: seclayer
    volumes:
      - stack-pg:/var/lib/postgresql/data
      - ${PG_TLS_DIR:?set PG_TLS_DIR in .env}:/certs:ro
    # The image's entrypoint looks `postgres` up on PATH; overriding CMD with a
    # shell drops that PATH, so set it explicitly (the image is pinned to 16).
    command:
      - sh
      - -c
      - "export PATH=/usr/lib/postgresql/16/bin:$$PATH; cp /certs/server.crt /tmp/tls.crt && cp /certs/server.key /tmp/tls.key && chown postgres:postgres /tmp/tls.crt /tmp/tls.key && chmod 600 /tmp/tls.key && exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tmp/tls.crt -c ssl_key_file=/tmp/tls.key"
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seclayer -d seclayer']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  stack-pg:
