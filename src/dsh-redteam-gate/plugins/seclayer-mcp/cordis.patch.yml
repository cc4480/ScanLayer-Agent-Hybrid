# SecLayer's own MCP server, from this machine's source, as its own section.
#
# Built from C:/sh/src/seclayer.io2026/mcp-server (`npm run build` -> dist/index.js)
# and pointed at the LOCAL app instance (127.0.0.1:4700). Nothing here touches the
# published npm package or the live service, so no live-account key is involved.
#
# The key and URL are referenced as ${credential:...}, never written in this file.
# They resolve from the gitignored project .env / harness-home .env.
#
# Tools appear as mcp__seclayer__* and cannot collide with the SecScan section.
- insert:
    - id: seclayer-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      # Without this the credential templates cannot resolve: the client refuses to
      # start credential references unless a credentials provider is injected.
      inject: ['credentials']
      config:
        serverName: seclayer
        transport: stdio
        command: node
        args:
          - 'C:\sh\src\seclayer.io2026\mcp-server\dist\index.js'
        expandTemplates: true
        env:
          SECLAYER_API_KEY: '${credential:SECLAYER_API_KEY}'
          SECLAYER_API_URL: '${credential:SECLAYER_API_URL}'
        failOnStartupError: false
